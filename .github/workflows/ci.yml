name: PQC-H365 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify (Ubuntu)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libssl-dev pkg-config

    - name: Build and Install liboqs
      run: |
        git clone --depth 1 --branch 0.10.0 https://github.com/open-quantum-safe/liboqs.git
        cd liboqs
        cmake -B build -G Ninja -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=/usr/local
        sudo ninja -C build install
        sudo ldconfig

    - name: Configure CMake
      run: |
        export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
        cmake -B build -G Ninja

    - name: Build PQC-H365 Targets
      run: ninja -C build
